const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

// Works offline and opens fast: the service worker keeps a copy of the app on the device.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Keep the browser's install offer for the dashboard's "Install app" button.
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__spInstallPrompt = e; });

async function open(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)));
  // Swap pages only once this one has finished loading; earlier, the browser appends instead of replacing.
  if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
// The device remembers the unlock key, not the password, so later opens skip the slow step.
const KEY = 'gal-einei-pulse-key';
const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }, clear() { try { localStorage.removeItem(KEY); localStorage.removeItem('gal-einei-pulse-pw'); } catch (e) {} } };
const box = document.getElementById('box');
const saved = store.get();
if (saved) {
  box.classList.add('opening');
  crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, false, ['decrypt'])
    .then(open)
    .catch(() => { store.clear(); box.classList.remove('opening'); document.getElementById('pw').focus(); }); // password changed since
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const go = document.getElementById('go');
  go.disabled = true;
  document.getElementById('err').hidden = true;
  try {
    const key = await keyFrom(pw);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)); // throws on a wrong password
    if (document.getElementById('rem').checked) store.set(toB64(await crypto.subtle.exportKey('raw', key))); else store.clear();
    await open(key);
  } catch (err) {
    store.clear();
    document.getElementById('err').hidden = false;
    go.disabled = false;
  }
});
